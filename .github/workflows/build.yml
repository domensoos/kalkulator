name: Prevajanje in preizkus

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prevedi
        run: g++ -std=c++20 -Wall -o kalkulator main.cpp Kalkulator.cpp

      - name: Preizkusi seštevanje
        run: |
          printf '1\n2\n3\n0\n' | ./kalkulator | grep "Rezultat: 5"